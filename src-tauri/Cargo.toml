[package]
name = "zdocs-reader"
version = "0.1.4"
description = "Local multi-project Markdown workspace"
authors = ["ZDocs"]
edition = "2021"

[lib]
name = "zdocs_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
